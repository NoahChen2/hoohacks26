<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitting Room — ReThread</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9C%82%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Gloock&family=Martian+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to workspace</a>
    <div id="site-header"></div>

    <main class="layout" id="main-content">
      <section class="inspector-shell" aria-label="Fitting room inspector">
        <nav class="fit-steps" id="tabs" aria-label="Fitting room steps">
          <button data-tab="body" class="active"><span class="fit-step-icon" data-tab-icon="body" aria-hidden="true"></span><span>Body</span></button>
          <button data-tab="closet"><span class="fit-step-icon" data-tab-icon="closet" aria-hidden="true"></span><span>Closet</span></button>
          <button data-tab="upcycle"><span class="fit-step-icon" data-tab-icon="upcycle" aria-hidden="true"></span><span>Upcycle</span></button>
        </nav>
        <aside class="panel" id="panel" tabindex="-1"></aside>
      </section>

      <section class="stage" aria-label="Interactive garment fitting preview">
        <div id="viewport"></div>
        <div class="stage-toolbar">
          <label class="chip"><input type="checkbox" id="tg-body" checked /> Body</label>
          <label class="chip"><input type="checkbox" id="tg-clothing" checked /> Clothing</label>
          <label class="chip"><input type="checkbox" id="tg-fit" /> Fit map</label>
          <label class="chip"><input type="checkbox" id="tg-spin" /> Turntable</label>
          <label class="chip"><input type="checkbox" id="tg-animate" checked /> Animate</label>
          <button class="chip" id="btn-reset-cam">Reset view</button>
        </div>
        <div class="fit-legend" id="fit-legend" hidden>
          <span><i style="background:#e5484d"></i>tight</span>
          <span><i style="background:#f5d90a"></i>snug</span>
          <span><i style="background:#46a758"></i>good</span>
          <span><i style="background:#3e63dd"></i>loose</span>
        </div>
        <div class="stage-caption" id="stage-caption"></div>
      </section>
    </main>

    <div class="overlay" id="overlay" hidden>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="project-title" tabindex="-1"></div>
    </div>

    <script type="module" src="/src/entry.js"></script>
  </body>
</html>

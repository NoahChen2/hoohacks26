# Render Blueprint: deploys the Vite app and its Node API server as one web service.
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: restitch
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      # Read by Vite at build time, so they must be set before the build runs.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
